<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>College Assistant Chatbot</title>
  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f2f5f9; color: #14213d; text-align: center; }
    header { background: #14213d; color: #fff; padding: 20px; }
    header h1 { margin: 0; font-size: 1.6rem; }
    main { padding: 24px 16px; }
    p { max-width: 480px; margin: 0 auto 20px; color: #3b4a6b; }
    footer { padding: 20px; font-size: .9rem; color: #3b4a6b; }
  </style>
</head>
<body>
  <header><h1>College Assistant</h1></header>

  <main>
    <p>Ask about admissions, fees, exams, timetable or hostel. Click the chat bubble at the bottom right.</p>
  </main>

  <footer>Your College Name</footer>

  <!-- Dialogflow chatbot: keep this inside <body>, at the end -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
  <df-messenger
    intent="WELCOME"
    chat-title="College_Assistance_Chatbot"
    agent-id="9b0f0fd0-786c-4b0b-a7c0-47b2353c8ced"
    language-code="en"
  ></df-messenger>
</body>
</html>
