<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>College Assistant Chatbot</title>
  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f2f5f9; color: #14213d; text-align: center; }
    header { background: #14213d; color: #fff; padding: 20px; }
    header h1 { margin: 0; font-size: 1.6rem; }
    main { padding: 24px 16px; }
    p { max-width: 480px; margin: 0 auto 20px; color: #3b4a6b; }
    iframe { width: 100%; max-width: 380px; height: 520px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
    footer { padding: 20px; font-size: .9rem; color: #3b4a6b; }
  </style>
</head>
<body>
  <header><h1>College Assistant</h1></header>
  <main>
    <p>Ask about admissions, fees, exams, timetable or hostel.</p>
    <iframe title="College chatbot" src="https://bot.dialogflow.com/9b0f0fd0-786c-4b0b-a7c0-47b2353c8ced"></iframe>
  </main>
  <footer>Your College Name</footer>

</html>
